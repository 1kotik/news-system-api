databaseChangeLog:
  - changeSet:
      author: kotik
      id: create-news-table
      changes:
        - createTable:
            tableName: news
            columns:
              - column:
                  name: news_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: preview_image_url
                  type: varchar(255)
              - column:
                  name: likes_count
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: dislikes_count
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: comments_count
                  type: integer
                  constraints:
                    nullable: false