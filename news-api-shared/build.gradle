plugins {
    id 'java'
    id 'maven-publish'
}

group = 'by.kotik'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    implementation("io.jsonwebtoken:jjwt-api:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.6")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.6")
    implementation("org.springframework:spring-web:6.2.8")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.19.1")
    implementation("io.github.openfeign:feign-core:13.6")
    compileOnly("jakarta.servlet:jakarta.servlet-api:6.1.0")
    implementation("org.springframework:spring-webmvc:6.2.8")
    implementation("org.springframework.security:spring-security-core:6.5.1")
    implementation("org.springframework.boot:spring-boot-starter-validation:3.5.3")
    implementation("com.google.api-client:google-api-client:2.8.0")
    implementation 'com.google.apis:google-api-services-drive:v3-rev20250717-2.0.0'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'by.kotik'
            artifactId = 'news-api-shared'
            version = '1.0.0'
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}