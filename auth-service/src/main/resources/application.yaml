spring:
  config:
    import: optional:.env[.properties]
  application:
    name: auth-service
server:
  port: 8085
jwt:
  secret: ${JWT_SECRET}
  lifetime: 30m
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8081/eureka
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level) %clr(%logger{36}){cyan} - %clr(%msg%n){faint}"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/auth-service.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 30
      file-name-pattern: logs/auth-service-%d{yyyy-MM-dd}.%i.log
  level:
    by.kotik: info
frontend:
  url: ${FRONTEND_URL}