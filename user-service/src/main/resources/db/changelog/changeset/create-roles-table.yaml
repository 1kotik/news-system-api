databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: kotik
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_name
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false